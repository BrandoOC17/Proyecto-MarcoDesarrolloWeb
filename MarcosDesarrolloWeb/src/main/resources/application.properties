spring.application.name=MarcosDesarrolloWeb

# Las credenciales NO van en el código: se leen del archivo .env (ver .env.example) o de variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:infinity_station}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.config.import=optional:file:.env[.properties],optional:file:MarcosDesarrolloWeb/.env[.properties],optional:file:Proyecto-MarcoDesarrolloWeb/MarcosDesarrolloWeb/.env[.properties]
# JWT para la API REST (/api/**). JWT_SECRET debe tener al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
