
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videojuegos - Infinity Station</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">

    <!-- Enlazar HTML con fuentes externas de Google Fonts -->
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Fuente Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Font-Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

</head>

<body>

    <!-- CABECERA -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <!-- Contenido principal de la página -->

    <main>

        <!-- Productos -->

        <section id="productos" class="padding-xl">

            <div class="container">

                <!-- Subtítulo con ícono -->

                <div class="subtitulo">

                    <i class="fa-brands fa-playstation"></i>

                    <h4>
                        Últimas novedades
                    </h4>

                </div>


                <!-- Título principal -->

                <h2 class="titulo">
                    Nuestros productos destacados
                </h2>


                <!-- Productos dinámicos -->

                <div class="row row-cols-1 row-cols-md-4 g-4 padding-xs">

                    <div class="col"
                        th:each="producto : ${productos}">

                        <div class="card h-100">

                            <img class="img-fluid card-img-top"
                                th:src="${producto.imagen}"
                                th:alt="${producto.nombre}">

                            <div class="card-body">

                                <h5 class="card-title"
                                    th:text="${producto.nombre}">
                                    Nombre del producto
                                </h5>

                                <p class="card-text"
                                    th:text="'S/ ' + ${producto.precio}">
                                    S/ 0.00
                                </p>

                                <div class="d-flex justify-content-end">

                                    <button class="btn btn-outline-secondary btn-agregar"
                                        th:data-id="${producto.id}"
                                        th:data-precio="${producto.precio}"
                                        th:data-plataforma="${producto.plataforma}"
                                        data-bs-toggle="modal"
                                        data-bs-target="#cartModal">

                                        Agregar al carro

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>


    <!-- Boton scrollUp -->

    <a href="#"
        class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none"
        id="scrollUpBtn">

        <i class="fa-solid fa-angle-up"></i>

    </a>


    <!-- Modal de producto agregado -->

    <div class="modal fade"
        id="cartModal"
        tabindex="-1"
        aria-labelledby="cartModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header border-0 pb-0">

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>


                <div class="modal-body text-center pt-0 pb-4">

                    <i class="fa-solid fa-circle-check text-success fa-3x mb-3"></i>

                    <h5 class="modal-title mb-2"
                        id="cartModalLabel">
                        ¡Éxito!
                    </h5>

                    <p class="fs-5 mb-0 text-muted">
                        Se agregó correctamente al carro
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript principal -->

    <script th:src="@{/js/script.js}">
    </script>

</body>

</html>
