<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Infinity Station</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Google Fonts Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>

    <!-- CABECERA -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- SECCIÓN DE CONTACTO -->
        <section id="contacto" class="padding-xl">

            <div class="container">

                <!-- Subtítulo -->
                <div class="subtitulo">

                    <i class="fa-solid fa-envelope"></i>

                    <h4>Ponte en contacto</h4>

                </div>

                <h2 class="titulo">
                    Contacta con nosotros
                </h2>


                <form onsubmit="return validarCaptcha()">

                    <div class="mb-3">

                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input type="text" class="form-control" id="nombre">

                    </div>


                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email" class="form-control" id="email" required aria-describedby="emailHelp">

                        <div id="emailHelp" class="form-text">

                            We'll never share your email with anyone else.

                        </div>

                    </div>


                    <div class="mb-3">

                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input type="tel" class="form-control" id="telefono">

                    </div>


                    <div class="mb-3">

                        <label for="asunto" class="form-label">
                            Asunto
                        </label>

                        <input type="text" class="form-control" id="asunto" required>

                    </div>


                    <div class="mb-3">

                        <label for="mensaje" class="form-label">
                            Mensaje
                        </label>

                        <textarea class="form-control" id="mensaje" rows="4">
                        </textarea>

                    </div>


                    <div class="mb-3">

                        <label for="captcha" class="form-label">
                            ¿Cuánto es 3 + 2?
                        </label>

                        <input type="number" class="form-control" id="captcha">

                    </div>


                    <button type="submit" class="fw-bold btn btn-primary enlace-azul">

                        Enviar

                    </button>

                </form>

            </div>

        </section>


        <!-- MODAL -->
        <div class="modal fade" id="captchaModal" tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            CAPTCHA incorrecto
                        </h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                        </button>

                    </div>


                    <div class="modal-body">

                        <p>
                            La respuesta es incorrecta.
                            Inténtalo nuevamente.
                        </p>

                    </div>


                    <div class="modal-footer">

                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">

                            Volver a intentarlo

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- BOTÓN SCROLL UP -->
    <a href="#" class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none" id="scrollUpBtn">

        <i class="fa-solid fa-angle-up"></i>

    </a>


    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script th:src="@{/js/script.js}"></script>

</body>

</html>
