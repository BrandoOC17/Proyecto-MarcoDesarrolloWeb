<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis compras - Infinity Station</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../static/css/estilos.css" th:href="@{/css/estilos.css}">

    <!-- Favicon -->
    <link rel="shortcut icon" href="../static/img/favicon.ico" th:href="@{/img/favicon.ico}"
        type="image/x-icon">

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Google Fonts Open Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>

    <!-- CABECERA -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section id="mis-compras" class="padding-xl">

            <div class="container">
                <div class="subtitulo mb-2">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <h4>Historial</h4>
                </div>
                <h2 class="compras-titulo mb-2">Mis compras realizadas</h2>

                <p class="text-muted mb-4">
                    Aquí podrás encontrar los estados de todas tus compras.
                </p>

                <!-- LISTA DE COMPRAS (se dibuja con JS desde lo guardado al pagar) -->
                <div id="lista-compras" class="d-flex flex-column gap-3"></div>

                <!-- SIN COMPRAS -->
                <div id="sin-compras" class="text-center py-5 d-none">
                    <i class="fa-solid fa-bag-shopping fs-1 text-muted mb-3"></i>
                    <p class="mb-3">Aún no has realizado ninguna compra.</p>
                    <a th:href="@{/videojuegos}" class="btn btn-primary fw-bold enlace-azul">Ver videojuegos</a>
                </div>

                <!-- PAGINACIÓN -->
                <nav class="d-flex justify-content-end mt-4" aria-label="Paginación de compras">
                    <ul class="pagination mb-0" id="paginacion-compras"></ul>
                </nav>

            </div>

        </section>

    </main>

    <!-- BOTÓN SCROLL UP -->
    <a href="#" class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none" id="scrollUpBtn">
        <i class="fa-solid fa-angle-up"></i>
    </a>
    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio (aquí están obtenerCompras, escaparHTML y formatoSoles) -->
    <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>


</body>

</html>
