<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Infinity Station</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Google Fonts Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>

    <!-- CABECERA -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <!-- REGISTRO -->
    <main>

        <section id="registro" class="py-5">

            <div class="container">

                <div class="row align-items-center justify-content-center g-5">

                    <!-- PRESENTACIÓN -->
                    <div class="col-12 col-lg-6 text-center">

                        <i class="fa-brands fa-playstation fa-4x mt-3"></i>

                        <h1 class="display-4 fw-bold">
                            Infinity Station
                        </h1>

                        <h2 class="mt-3">
                            ¡Bienvenido a Infinity Station!
                        </h2>

                        <p class="lead mt-3">
                            Crea tu cuenta para acceder a nuestra
                            tienda de videojuegos y disfrutar de
                            todo lo que tenemos para ti.
                        </p>

                    </div>


                    <!-- FORMULARIO -->
                    <div class="col-12 col-md-8 col-lg-5">

                        <div class="card shadow-sm border-0">

                            <div class="card-body p-4 p-md-5">

                                <h3 class="text-center mb-4">
                                    Crea tu cuenta
                                </h3>

                                <!-- FORMULARIO CON THYMELEAF -->
                                <form th:action="@{/registro}" method="post">

                                    <!-- NOMBRE -->
                                    <div class="mb-3">

                                        <label for="nombre" class="form-label">

                                            Nombre completo

                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="fa-regular fa-user"></i>

                                            </span>

                                            <input type="text" class="form-control" id="nombre" name="nombre"
                                                placeholder="Ingresa tu nombre" required>

                                        </div>

                                    </div>


                                    <!-- CORREO -->
                                    <div class="mb-3">

                                        <label for="correo" class="form-label">

                                            Correo electrónico

                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="fa-regular fa-envelope"></i>

                                            </span>

                                            <input type="email" class="form-control" id="correo" name="correo"
                                                placeholder="Ingresa tu correo" required>

                                        </div>

                                    </div>


                                    <!-- CREAR CONTRASEÑA -->
                                    <div class="mb-3">

                                        <label for="password" class="form-label">

                                            Crear contraseña

                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="fa-solid fa-lock"></i>

                                            </span>

                                            <input type="password" class="form-control" id="password" name="password"
                                                placeholder="Crea una contraseña" required>

                                        </div>

                                    </div>


                                    <!-- CONFIRMAR CONTRASEÑA -->
                                    <div class="mb-4">

                                        <label for="confirmPassword" class="form-label">

                                            Confirmar contraseña

                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="fa-solid fa-lock"></i>

                                            </span>

                                            <input type="password" class="form-control" id="confirmPassword"
                                                name="confirmPassword" placeholder="Confirma tu contraseña" required>

                                        </div>

                                    </div>


                                    <!-- BOTÓN -->
                                    <div class="d-grid">

                                        <button type="submit" class="btn btn-primary btn-lg fw-bold enlace-azul">

                                            Crear cuenta

                                        </button>

                                    </div>

                                </form>

                            </div>


                            <!-- INICIAR SESIÓN -->
                            <div class="card-footer text-center py-4">

                                <p class="fw-bold mb-2 text-dark">

                                    ¿Ya tienes una cuenta?

                                </p>

                                <a th:href="@{/login}" class="fw-bold text-decoration-none">

                                    Iniciar sesión

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Botón scrollUp -->
    <a href="#" class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none" id="scrollUpBtn">

        <i class="fa-solid fa-angle-up"></i>

    </a>


    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script th:src="@{/js/script.js}"></script>

</body>

</html>
