<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario | Infinity Station</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container my-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width:720px;">
            <div class="card-body p-4">
                <h1 class="h3 fw-bold mb-4">Registrar usuario</h1>
                <!-- Los mensajes de validación corresponden a datos revisados en el servidor. -->
                <form method="post" th:action="@{/administracion/usuarios/nuevo}"
                    th:object="${registroForm}">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre completo</label>
                        <input class="form-control" id="nombre" th:field="*{nombre}"
                            placeholder="Ej. Ana María García" required maxlength="100">
                        <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="correo">Correo</label>
                        <input class="form-control" id="correo" type="email" th:field="*{correo}"
                            required maxlength="300">
                        <small class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-control" id="password" type="password" name="password"
                            required minlength="8" maxlength="72">
                        <small class="text-danger" th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}"></small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
                        <input class="form-control" id="confirmPassword" type="password" name="confirmPassword"
                            required>
                        <small class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}"
                            th:errors="*{confirmPassword}"></small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Guardar usuario</button>
                        <a class="btn btn-outline-secondary" th:href="@{/administracion/usuarios}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- BOTÓN SCROLL UP -->
    <a th:href="@{#}"
       class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none"
       id="scrollUpBtn">

        <i class="fa-solid fa-angle-up"></i>
    </a>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Principal -->
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
