<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | Infinity Station</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Google Fonts Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <!-- CABECERA -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <!-- INTERFAZ CARRITO -->
    <main>

        <section class="padding-carrito">

            <div class="container">

                <div class="row g-4">

                    <!-- CARRO DE COMPRAS -->
                    <div class="col-lg-8">

                        <h2 class="titulo-carrito mb-3">
                            Carro de compras
                        </h2>

                        <div class="card carrito-card">

                            <div class="card-body p-4">

                                <p class="mb-3 vendido-por">
                                    Vendido por:
                                    <strong class="vendedor">
                                        Infinity Station
                                    </strong>
                                </p>

                                <div id="lista-carrito"></div>

                            </div>

                        </div>

                    </div>


                    <!-- RESUMEN DE LA COMPRA -->
                    <div class="col-lg-4">

                        <h2 class="titulo-carrito mb-3">
                            Resumen de la compra
                        </h2>

                        <div class="card carrito-card">

                            <div class="card-body p-4">

                                <!-- Productos -->
                                <a class="d-flex justify-content-between align-items-center text-decoration-none text-reset mb-2"
                                    data-bs-toggle="collapse" href="#detalle-productos" role="button"
                                    aria-expanded="true" aria-controls="detalle-productos">

                                    <span>
                                        Productos
                                        (<span id="resumen-cantidad">0</span>)
                                    </span>

                                    <span>

                                        <strong id="resumen-subtotal">
                                            S/ 0.00
                                        </strong>

                                        <i class="fa-solid fa-chevron-up ms-1 chevron-resumen"></i>

                                    </span>

                                </a>


                                <div class="collapse show" id="detalle-productos">

                                    <div id="resumen-lista" class="small mb-3">
                                    </div>

                                </div>


                                <!-- Medios de pago -->
                                <div class="d-flex justify-content-between fw-bold mb-2">

                                    <span>
                                        Otros medios de pago
                                    </span>

                                    <span class="resumen-total">
                                        S/ 0.00
                                    </span>

                                </div>


                                <div class="d-flex justify-content-between fw-bold">

                                    <span>
                                        <i class="fa-regular fa-credit-card me-1"></i>
                                        Tarjeta de crédito o débito
                                    </span>

                                    <span class="resumen-total">
                                        S/ 0.00
                                    </span>

                                </div>

                            </div>


                            <hr class="m-0">


                            <div class="card-body p-4">

                                <div class="d-grid mb-3">

                                    <button id="btn-pagar" class="btn btn-lg rounded-pill fw-bold text-white">

                                        Comprar

                                    </button>

                                </div>

                                <div class="text-center mt-3">

                                    <a th:href="@{/videojuegos}" class="link-dark">

                                        Seguir comprando

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- BOTÓN SCROLL UP -->
    <a href="#" class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none" id="scrollUpBtn">

        <i class="fa-solid fa-angle-up"></i>

    </a>


    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script th:src="@{/js/script.js}"></script>

</body>

</html>
