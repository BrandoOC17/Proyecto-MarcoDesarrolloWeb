<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | Infinity Station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container my-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width:720px;">
            <div class="card-body p-4">
                <h1 class="h3 fw-bold mb-4" th:text="${producto.id == null ? 'Registrar producto' : 'Editar producto'}">
                    Producto
                </h1>
                <!-- Formulario administrativo para guardar productos en MySQL. -->
                <form method="post" th:action="@{/administracion/productos/guardar}" th:object="${producto}">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" id="nombre" th:field="*{nombre}" required maxlength="150">
                        <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="precio">Precio</label>
                        <input class="form-control" id="precio" type="number" step="0.01" min="0.01"
                            th:field="*{precio}" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="plataforma">Plataforma</label>
                        <input class="form-control" id="plataforma" th:field="*{plataforma}" maxlength="50">
                        <small class="text-danger" th:if="${#fields.hasErrors('plataforma')}"
                            th:errors="*{plataforma}"></small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="imagen">Ruta de imagen</label>
                        <input class="form-control" id="imagen" th:field="*{imagen}" placeholder="/img/juego.png">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/administracion/productos}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
