<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar productos | Infinity Station</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="h2 fw-bold">Administrar productos</h1>
                <p class="text-muted mb-0">Registra y actualiza los productos del catálogo.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/administracion/productos/nuevo}">Nuevo producto</a>
        </div>
        <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>
        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Producto</th><th>Precio</th><th>Plataforma</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.id}">1</td>
                            <td>
                                <img th:src="${producto.imagen}" th:alt="${producto.nombre}"
                                    class="rounded me-2" style="width:48px;height:48px;object-fit:cover;">
                                <span th:text="${producto.nombre}">Producto</span>
                            </td>
                            <td th:text="'S/ ' + ${producto.precio}">S/ 0.00</td>
                            <td th:text="${producto.plataforma ?: '-'}">PS5</td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a class="btn btn-sm btn-outline-primary"
                                        th:href="@{/administracion/productos/{id}/editar(id=${producto.id})}">Editar</a>
                                    <form method="post"
                                        th:action="@{/administracion/productos/{id}/eliminar(id=${producto.id})}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="5" class="text-center py-4">No hay productos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <!-- BOTÓN SCROLL UP -->
    <a th:href="@{#}"
       class="btn btn-primary rounded-0 position-fixed bottom-0 end-0 m-4 d-none"
       id="scrollUpBtn">

        <i class="fa-solid fa-angle-up"></i>

    </a>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Principal -->
    <script th:src="@{/js/script.js}"></script>

</body>
</html>
